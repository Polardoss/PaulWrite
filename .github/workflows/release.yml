name: Release

# Se déclenche quand une étiquette `vX.Y.Z` est poussée : construit l'archive de distribution et
# la publie dans une version GitHub. Rien ne part tant qu'aucune étiquette n'est poussée.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Archive de distribution (construit l'exécutable)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$((Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value)") {
            throw "L'étiquette $tag ne correspond pas à la version de Cargo.toml"
          }
          ./scripts/package.ps1

      - name: Publier la version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip, dist/*.sha256) `
            --title "PaulWrite ${{ github.ref_name }}" --generate-notes
