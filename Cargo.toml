[workspace]
resolver = "2"
members = [
    "crates/paulwrite-core",
    "crates/paulwrite-syntax",
    "crates/paulwrite-search",
    "crates/paulwrite-render",
    "crates/paulwrite-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Polardoss/PaulWrite"
rust-version = "1.80"

[workspace.dependencies]
# Sauts de ligne = LF et CRLF uniquement (pas de VT/FF/NEL/LS/PS ni CR seul) : prévisible pour un éditeur de code.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.12"
memmap2 = "0.9"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Profil release : vitesse maximale, binaire compact.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Profil de profiling : identique à release mais avec symboles (lignes) pour
# WPA / samply / VTune. Usage : cargo build --profile profiling
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# Les benchmarks mesurent le code tel qu'il sera livré.
[profile.bench]
inherits = "release"
strip = false
debug = "line-tables-only"
